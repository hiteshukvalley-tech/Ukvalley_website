# Render Blueprint — https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repository. Values marked `sync: false`
# are asked for once in the Render dashboard and never stored in Git.
services:
  - type: web
    name: ukvalley
    runtime: node
    # Free instances sleep after 15 min idle (~1 min cold start) and have
    # 512 MB RAM, which a `next build` of this site can exceed. Starter is
    # always on; downgrade in the dashboard if that trade-off is fine.
    plan: starter
    # Closest Render region to India. Put the Atlas cluster in the same
    # region (AWS ap-southeast-1) to keep database round trips short.
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build
    # `next start` listens on $PORT, which Render sets.
    startCommand: npm start
    # Static route: a health check that doesn't depend on the database.
    healthCheckPath: /robots.txt
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The site's address (add it under Settings → Custom Domains). Read at
      # build time: change it, then redeploy.
      # Frontend: the public website (canonical links, sitemap, SEO).
      - key: NEXT_PUBLIC_SITE_URL
        value: https://uat.ukvalley.com
      # Backend: the admin panel and server routes (/admin, /media, /careers/apply).
      - key: NEXT_PUBLIC_API_URL
        value: https://uat.ukvalley.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ukvalley
      # Email for admin "Forgot password" codes (see .env.example).
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
